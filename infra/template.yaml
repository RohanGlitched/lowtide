AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lowtide on AWS: the Next.js site and MCP server on AWS Lambda (Node.js 22, arm64) behind a Function URL in
  response-streaming mode, fronted by CloudFront, with static assets in S3 (origin access control), households in
  the existing S3 bucket, Amazon Bedrock (Nova Micro) and Amazon Polly called with the function's own role (no
  static keys), Amazon EventBridge Scheduler running tonight's plan twice each evening, structured logs, metric
  filters, an error alarm and a dashboard in CloudWatch. Free-tier sized, ap-southeast-2 only.

Parameters:
  CodeBucket:
    Type: String
    Description: Bucket holding the Lambda zip (created by infra/deploy.py)
  CodeKey:
    Type: String
    Description: Key of the Lambda zip in CodeBucket
  HomesBucket:
    Type: String
    Default: lowtide-homes-0415
    Description: Existing private bucket with the households, the daily counters and the speech cache
  Adapter:
    Type: String
    Default: layer
    AllowedValues: [layer, bridge]
    Description: layer = AWS Lambda Web Adapter (public layer); bridge = the package's own Node streaming bridge
  AdapterLayerArn:
    Type: String
    Default: ""
    Description: Lambda Web Adapter layer (arm64); empty = arn:aws:lambda:<region>:753240598075:layer:LambdaAdapterLayerArm64:30
  BedrockModel:
    Type: String
    Default: ""
    Description: Bedrock model or inference profile to try first; empty = apac.amazon.nova-micro-v1:0, then Nova Lite
  DailyModelCap:
    Type: Number
    Default: 1500
    Description: Bedrock calls per UTC day across all visitors (spending guard; the phrase router answers after that)
  PollyDailyChars:
    Type: Number
    Default: 40000
    Description: Amazon Polly characters per UTC day (spending guard; the browser's voice speaks after that)
  MemorySize:
    Type: Number
    Default: 1024
  MaxConcurrency:
    Type: Number
    Default: 25
    Description: >
      Reserved concurrency: room for a few judges at once (one Echo page load is about five requests), and a cap on
      spend if the site is hammered; 0 = don't reserve any. The account allows 400, of which 100 must stay unreserved.
  Observability:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Metric filters and the CloudWatch dashboard (the error alarm is always created)
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional address that gets the error alarm by email (an SNS topic; confirm the subscription)
  ScheduleToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Random per-deploy token the schedule sends and /events checks (deploy.py generates it)
  OriginSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Secret CloudFront sends to the function in x-lowtide-origin (infra/deploy.py generates it once and keeps it)
  OriginCheck:
    Type: String
    Default: "off"
    AllowedValues: ["on", "off"]
    Description: on = the function refuses requests without the CloudFront secret, so its URL can't be used to skip CloudFront
  KeepWarm:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: EventBridge Scheduler wakes the function every 5 minutes and refreshes the price feeds (free tier sized)
  NightlySchedule:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: EventBridge Scheduler runs tonight's plan at 16:45 and 18:30 London time (false = only the lazy roll)
  McpAuth:
    Type: String
    Default: optional
    AllowedValues: [optional, required]
    Description: >
      OAuth on /api/mcp. optional = no token is the guest server (judges' and connectors' links keep working) and a
      bearer token is checked when sent; required = no token gets 401 with the protected resource metadata.
      /api/mcp/account always requires a token; household links (/api/mcp/h/<id>) never do. Tokens are opaque,
      hashed in HomesBucket under oauth/, so there is no signing key to configure.

Conditions:
  UseLayer: !Equals [!Ref Adapter, layer]
  DefaultLayer: !Equals [!Ref AdapterLayerArn, ""]
  Reserve: !Not [!Equals [!Ref MaxConcurrency, "0"]]
  WithObservability: !Equals [!Ref Observability, "true"]
  WithEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasModel: !Not [!Equals [!Ref BedrockModel, ""]]
  WithSchedule: !Equals [!Ref NightlySchedule, "true"]
  WithWarm: !Equals [!Ref KeepWarm, "true"]
  WithScheduler: !Or [!Condition WithSchedule, !Condition WithWarm]

Resources:
  # site/_next/static/* (immutable, hashed) and nothing else; households stay in HomesBucket
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  FnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: lowtide
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Nova Micro and Nova Lite only: the APAC inference profiles in this region, and the foundation
              # models in whichever APAC region the profile routes a call to
              - Sid: Bedrock
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-micro-v1:0"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-lite-v1:0"
                  - arn:aws:bedrock:*::foundation-model/amazon.nova-micro-v1:0
                  - arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0
              - Sid: Households
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "arn:aws:s3:::${HomesBucket}/*"
              - Sid: HouseholdList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${HomesBucket}"
              - Sid: Voice
                Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: "*"

  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}"
      RetentionInDays: 14

  Fn:
    Type: AWS::Lambda::Function
    DependsOn: Logs
    Properties:
      FunctionName: !Ref AWS::StackName
      Description: Lowtide site and MCP server (Next.js standalone)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: !If [UseLayer, run.sh, bridge.handler]
      MemorySize: !Ref MemorySize
      Timeout: 30
      ReservedConcurrentExecutions: !If [Reserve, !Ref MaxConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt FnRole.Arn
      Layers: !If
        - UseLayer
        - [!If [DefaultLayer, !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:30", !Ref AdapterLayerArn]]
        - !Ref AWS::NoValue
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      LoggingConfig:
        LogGroup: !Ref Logs
        LogFormat: Text
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: !If [UseLayer, /opt/bootstrap, !Ref AWS::NoValue]
          AWS_LWA_INVOKE_MODE: response_stream
          AWS_LWA_PORT: "8080"
          AWS_LWA_READINESS_CHECK_PATH: /api/health
          # non-HTTP invocations (the nightly schedule) arrive as a POST from 127.0.0.1 to this path
          AWS_LWA_PASS_THROUGH_PATH: /events
          SCHEDULE_TOKEN: !Ref ScheduleToken
          ORIGIN_SECRET: !Ref OriginSecret
          ORIGIN_CHECK: !Ref OriginCheck
          PORT: "8080"
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          S3_BUCKET: !Ref HomesBucket
          S3_REGION: !Ref AWS::Region
          BEDROCK_REGION: !Ref AWS::Region
          BEDROCK_MODEL: !If [HasModel, !Ref BedrockModel, !Ref AWS::NoValue]
          POLLY_REGION: !Ref AWS::Region
          DAILY_MODEL_CAP: !Ref DailyModelCap
          POLLY_DAILY_CHARS: !Ref PollyDailyChars
          MCP_AUTH: !Ref McpAuth

  FnUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Fn.Arn
      AuthType: NONE
      InvokeMode: RESPONSE_STREAM

  FnUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Fn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # since Oct 2025 a public function URL also needs lambda:InvokeFunction, granted only for calls through the URL
  FnUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Fn
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # Tonight's plan, computed ahead: Octopus publishes tomorrow's Agile prices around 16:00-17:00 UK time, so the
  # schedule runs at 16:45 and again at 18:30 (the second finds the first's work done, or catches a late
  # publication). The Web Adapter passes the event to POST /events; the lazy roll on ordinary requests stays as
  # the fallback. Named lowtide-* (and the role lowtide-web-*) to fit the deploy user's scoped permissions.
  SchedulerRole:
    Type: AWS::IAM::Role
    Condition: WithScheduler
    Properties:
      RoleName: !Sub "${AWS::StackName}-scheduler"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-lowtide
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt Fn.Arn

  TonightEarly:
    Type: AWS::Scheduler::Schedule
    Condition: WithSchedule
    Properties:
      Name: !Sub "${AWS::StackName}-tonight-1645"
      GroupName: default
      Description: Plan tonight for every household once tomorrow's Agile prices are out
      ScheduleExpression: cron(45 16 * * ? *)
      ScheduleExpressionTimezone: Europe/London
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: !GetAtt Fn.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"source":"lowtide.schedule","job":"tonight","token":"${ScheduleToken}"}'
        RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 3600 }

  TonightLate:
    Type: AWS::Scheduler::Schedule
    Condition: WithSchedule
    Properties:
      Name: !Sub "${AWS::StackName}-tonight-1830"
      GroupName: default
      Description: Second pass for tonight's plan (a late Agile publication, or households the first pass ran out of time for)
      ScheduleExpression: cron(30 18 * * ? *)
      ScheduleExpressionTimezone: Europe/London
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: !GetAtt Fn.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"source":"lowtide.schedule","job":"tonight","token":"${ScheduleToken}"}'
        RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 3600 }

  # Keeps one instance warm and its price feeds fresh, so the first visitor after a quiet spell doesn't pay a cold
  # start plus a dozen feed fetches from Sydney (about 8,600 invocations a month, well inside the free tier).
  KeepWarmSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: WithWarm
    Properties:
      Name: !Sub "${AWS::StackName}-warm"
      GroupName: default
      Description: Wake the function and refresh the price feeds every five minutes
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: !GetAtt Fn.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"source":"lowtide.schedule","job":"warm","token":"${ScheduleToken}"}'
        RetryPolicy: { MaximumRetryAttempts: 0, MaximumEventAgeInSeconds: 300 }

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: WithEmail
    Properties:
      Subscription:
        - { Protocol: email, Endpoint: !Ref AlarmEmail }

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lowtide Lambda errors (crashes, timeouts) in five minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Fn }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [WithEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  # One JSON line per tool call, model turn, Polly request, nightly roll and scheduled run (web/lib/log.ts) becomes a metric.
  ToolCallsMetric:
    Type: AWS::Logs::MetricFilter
    Condition: WithObservability
    Properties:
      LogGroupName: !Ref Logs
      FilterName: lowtide-tool-calls
      FilterPattern: '{ $.evt = "tool" }'
      MetricTransformations: [{ MetricNamespace: Lowtide, MetricName: ToolCalls, MetricValue: "1", DefaultValue: 0 }]
  ToolErrorsMetric:
    Type: AWS::Logs::MetricFilter
    Condition: WithObservability
    Properties:
      LogGroupName: !Ref Logs
      FilterName: lowtide-tool-errors
      FilterPattern: '{ $.evt = "tool" && $.ok IS FALSE }'
      MetricTransformations: [{ MetricNamespace: Lowtide, MetricName: ToolErrors, MetricValue: "1", DefaultValue: 0 }]
  BedrockTurnsMetric:
    Type: AWS::Logs::MetricFilter
    Condition: WithObservability
    Properties:
      LogGroupName: !Ref Logs
      FilterName: lowtide-bedrock-turns
      FilterPattern: '{ $.evt = "model" && $.engine = "bedrock" && $.ok IS TRUE }'
      MetricTransformations: [{ MetricNamespace: Lowtide, MetricName: BedrockTurns, MetricValue: "1", DefaultValue: 0 }]
  BedrockLatencyMetric:
    Type: AWS::Logs::MetricFilter
    Condition: WithObservability
    Properties:
      LogGroupName: !Ref Logs
      FilterName: lowtide-bedrock-latency
      FilterPattern: '{ $.evt = "model" && $.engine = "bedrock" && $.ok IS TRUE }'
      MetricTransformations: [{ MetricNamespace: Lowtide, MetricName: BedrockLatency, MetricValue: "$.ms", Unit: Milliseconds }]
  FallbackTurnsMetric:
    Type: AWS::Logs::MetricFilter
    Condition: WithObservability
    Properties:
      LogGroupName: !Ref Logs
      FilterName: lowtide-fallback-turns
      FilterPattern: '{ $.evt = "model" && $.engine = "fallback" }'
      MetricTransformations: [{ MetricNamespace: Lowtide, MetricName: FallbackTurns, MetricValue: "1", DefaultValue: 0 }]
  PollyCharsMetric:
    Type: AWS::Logs::MetricFilter
    Condition: WithObservability
    Properties:
      LogGroupName: !Ref Logs
      FilterName: lowtide-polly-chars
      FilterPattern: '{ $.evt = "speak" && $.ok IS TRUE && $.cached NOT EXISTS }'
      MetricTransformations: [{ MetricNamespace: Lowtide, MetricName: PollyCharacters, MetricValue: "$.chars", DefaultValue: 0 }]
  TonightPlansMetric:
    Type: AWS::Logs::MetricFilter
    Condition: WithObservability
    Properties:
      LogGroupName: !Ref Logs
      FilterName: lowtide-tonight-plans
      FilterPattern: '{ $.evt = "tonight" && $.ok IS TRUE }'
      MetricTransformations: [{ MetricNamespace: Lowtide, MetricName: TonightPlans, MetricValue: "$.computed", DefaultValue: 0 }]
  ScheduledRunsMetric:
    Type: AWS::Logs::MetricFilter
    Condition: WithObservability
    Properties:
      LogGroupName: !Ref Logs
      FilterName: lowtide-scheduled-runs
      FilterPattern: '{ $.evt = "schedule" && $.ok IS TRUE }'
      MetricTransformations: [{ MetricNamespace: Lowtide, MetricName: ScheduledRuns, MetricValue: "1", DefaultValue: 0 }]
  ScheduledPlansMetric:
    Type: AWS::Logs::MetricFilter
    Condition: WithObservability
    Properties:
      LogGroupName: !Ref Logs
      FilterName: lowtide-scheduled-plans
      FilterPattern: '{ $.evt = "schedule" && $.ok IS TRUE }'
      MetricTransformations: [{ MetricNamespace: Lowtide, MetricName: ScheduledPlans, MetricValue: "$.planned", DefaultValue: 0 }]
  ScheduledFailuresMetric:
    Type: AWS::Logs::MetricFilter
    Condition: WithObservability
    Properties:
      LogGroupName: !Ref Logs
      FilterName: lowtide-scheduled-failures
      FilterPattern: '{ $.evt = "schedule" && $.ok IS FALSE }'
      MetricTransformations: [{ MetricNamespace: Lowtide, MetricName: ScheduledFailures, MetricValue: "1", DefaultValue: 0 }]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: WithObservability
    Properties:
      DashboardName: !Ref AWS::StackName
      DashboardBody: !Sub |
        {"widgets":[
        {"type":"text","x":0,"y":0,"width":24,"height":2,"properties":{"markdown":"## Lowtide on AWS\nLambda ${Fn} behind CloudFront ${Cdn.DomainName}. Model turns: Amazon Nova Micro on Bedrock. Voice: Amazon Polly. Tonight's plan: EventBridge Scheduler at 16:45 and 18:30 London time. Logs: ${Logs} (one JSON line per tool call, model turn, voice request, nightly roll and scheduled run)."}},
        {"type":"metric","x":0,"y":2,"width":8,"height":6,"properties":{"title":"Requests and errors","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/Lambda","Invocations","FunctionName","${Fn}"],[".","Errors",".","."],[".","Throttles",".","."]]}},
        {"type":"metric","x":8,"y":2,"width":8,"height":6,"properties":{"title":"Duration (ms)","region":"${AWS::Region}","period":300,"metrics":[["AWS/Lambda","Duration","FunctionName","${Fn}",{"stat":"p50"}],["...",{"stat":"p95"}],["...",{"stat":"Maximum"}]]}},
        {"type":"metric","x":16,"y":2,"width":8,"height":6,"properties":{"title":"Concurrent instances","region":"${AWS::Region}","stat":"Maximum","period":300,"metrics":[["AWS/Lambda","ConcurrentExecutions","FunctionName","${Fn}"]]}},
        {"type":"metric","x":0,"y":8,"width":8,"height":6,"properties":{"title":"MCP tool calls","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["Lowtide","ToolCalls"],[".","ToolErrors"]]}},
        {"type":"metric","x":8,"y":8,"width":8,"height":6,"properties":{"title":"Model turns: Bedrock and the phrase router","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["Lowtide","BedrockTurns"],[".","FallbackTurns"]]}},
        {"type":"metric","x":16,"y":8,"width":8,"height":6,"properties":{"title":"Bedrock latency (ms)","region":"${AWS::Region}","period":300,"metrics":[["Lowtide","BedrockLatency",{"stat":"p50"}],["...",{"stat":"p95"}]]}},
        {"type":"metric","x":0,"y":14,"width":8,"height":6,"properties":{"title":"Bedrock invocations (AWS/Bedrock)","region":"${AWS::Region}","period":300,"metrics":[[{"expression":"SEARCH('{AWS/Bedrock,ModelId} MetricName=\"Invocations\"', 'Sum', 300)","id":"b"}]]}},
        {"type":"metric","x":8,"y":14,"width":8,"height":6,"properties":{"title":"Polly characters and tonight's plans","region":"${AWS::Region}","stat":"Sum","period":3600,"metrics":[["Lowtide","PollyCharacters"],[".","TonightPlans",{"yAxis":"right"}]]}},
        {"type":"log","x":16,"y":14,"width":8,"height":6,"properties":{"title":"Tool calls by time taken","region":"${AWS::Region}","view":"table","query":"SOURCE '${Logs}' | filter evt = \"tool\" | stats count(*) as calls, avg(ms) as avg_ms, max(ms) as max_ms by tool | sort avg_ms desc"}},
        {"type":"metric","x":0,"y":20,"width":12,"height":6,"properties":{"title":"Nightly schedule (EventBridge Scheduler): runs, failures, households planned","region":"${AWS::Region}","stat":"Sum","period":3600,"metrics":[["Lowtide","ScheduledRuns"],[".","ScheduledFailures"],[".","ScheduledPlans",{"yAxis":"right"}]]}},
        {"type":"log","x":12,"y":20,"width":12,"height":6,"properties":{"title":"Scheduled runs","region":"${AWS::Region}","view":"table","query":"SOURCE '${Logs}' | filter evt = \"schedule\" | fields @timestamp, ok, night, planned, skipped, steps, done, ms | sort @timestamp desc | limit 20"}}
        ]}

  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The function sees its own URL as Host; this hands it the address the visitor used (links, same-origin checks),
  # and closes /events (the scheduler's pass-through route) to visitors.
  ForwardHostFn:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-forward-host"
      AutoPublish: true
      FunctionConfig: { Comment: viewer Host to x-forwarded-host, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          // /events is the scheduler's pass-through route inside the function: CloudFront never forwards it (the
          // function itself also refuses it without the schedule token, and refuses its own URL without the origin secret)
          if (r.uri === '/events' || r.uri.indexOf('/events/') === 0) {
            return { statusCode: 404, statusDescription: 'Not Found' };
          }
          r.headers['x-forwarded-host'] = { value: r.headers.host.value };
          return r;
        }

  # Pages: cached only as long as Next.js says (ISR pages s-maxage=300, dynamic ones not at all). Next's RSC
  # headers are in the key so a page and its client-navigation payload never share an entry.
  PagesCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-pages"
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          QueryStringsConfig: { QueryStringBehavior: all }
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [rsc, next-router-prefetch, next-router-state-tree, next-url]

  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Lowtide
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Origins:
          - Id: app
            DomainName: !Select [2, !Split ["/", !GetAtt FnUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 30, OriginKeepaliveTimeout: 60 }
            # proves a request came through CloudFront (web/middleware.ts refuses the Function URL without it)
            OriginCustomHeaders:
              - { HeaderName: x-lowtide-origin, HeaderValue: !Ref OriginSecret }
          - Id: static
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginPath: /site
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt Oac.Id
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref PagesCachePolicy
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ForwardHostFn.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # MCP (Streamable HTTP, streamed answers), the model and voice routes: never cached, every header but Host
          - PathPattern: /api/*
            TargetOriginId: app
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardHostFn.FunctionMetadata.FunctionARN
          - PathPattern: /_next/static/*
            TargetOriginId: static
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/site/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}"

Outputs:
  SiteUrl:
    Value: !Sub "https://${Cdn.DomainName}"
  McpUrl:
    Value: !Sub "https://${Cdn.DomainName}/api/mcp"
  McpAccountUrl:
    Description: The same MCP server behind OAuth 2.1 (401 + resource metadata without a token)
    Value: !Sub "https://${Cdn.DomainName}/api/mcp/account"
  OAuthMetadataUrl:
    Value: !Sub "https://${Cdn.DomainName}/.well-known/oauth-authorization-server"
  DistributionId:
    Value: !Ref Cdn
  Bucket:
    Value: !Ref Bucket
  FunctionUrl:
    Value: !GetAtt FnUrl.FunctionUrl
  FunctionName:
    Value: !Ref Fn
  LogGroup:
    Value: !Ref Logs
  Schedules:
    Condition: WithSchedule
    Value: !Sub "${TonightEarly}, ${TonightLate} (Europe/London)"
  DashboardUrl:
    Condition: WithObservability
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${AWS::StackName}"
